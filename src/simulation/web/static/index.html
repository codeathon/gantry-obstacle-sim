<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Prey gantry hunt sim</title>
	<link rel="stylesheet" href="/static/sim.css" />
</head>
<body>
	<header>
		<div>
			<h1>Hunt sim</h1>
			<p class="sub">pylon-track arena · Basler ace 2 delay · Zaber XY API</p>
		</div>
		<div class="keys">
			<button type="button" data-trial="start">Start trial (S)</button>
			<button type="button" data-trial="end">End (E)</button>
			<button type="button" data-trial="reset">Reset (R)</button>
			<span id="trial-badge" class="badge">warmup</span>
		</div>
	</header>
	<main>
		<section class="arena-wrap">
			<canvas id="arena" width="960" height="600"></canvas>
			<p class="hint">Toy pose is gantry encoder mm on the Ace FOV (same origin). Teal box is firmware travel — the toy can only roam that rectangle. Keep-away walls follow the rails, not the camera edge.</p>
		</section>
		<aside id="hud"></aside>
	</main>
	<script src="/static/sim.js"></script>
</body>
</html>
